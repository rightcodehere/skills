<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 Cover — Light</title>
<link rel="stylesheet" href="../assets/chrome.css">
</head>
<body>
<div class="slide-container" data-screen-label="01 Cover (Light)">

  <!-- Top-right logo -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:924px; top:42px; width:294px; height:112px; z-index:5;">
    <img src="../assets/logo.png" alt="Daiichi Life Techno Cross"
         style="width:100%; height:100%; object-fit:contain; object-position:right top;">
  </div>

  <!-- Cover title -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:79px; top:280px; width:1134px; z-index:10;
              font-size:var(--fs-cover-title); font-weight:700; color:var(--color-cobalt);
              line-height:1.05; letter-spacing:-0.5px;">
    Presentation Title
  </div>

  <!-- Date -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:79px; top:420px; width:440px; z-index:10;
              font-size:var(--fs-cover-meta); color:var(--color-ink); line-height:1.4;">
    2025.00.00
  </div>

  <!-- Company / subtitle line -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:79px; top:462px; width:600px; z-index:10;
              font-size:var(--fs-cover-meta); color:var(--color-ink); line-height:1.4;">
    Daiichi Life Techno Cross Co., Ltd.
  </div>

  <!-- Bottom decorative band -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:0; top:640px; width:1280px; height:80px; z-index:1;">
    <img src="../assets/cover-band.png" alt=""
         style="width:100%; height:100%; object-fit:cover; object-position:bottom;">
  </div>

</div>
</body>
</html>
