<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 Cover — Blue</title>
<link rel="stylesheet" href="../assets/chrome.css">
</head>
<body>
<div class="slide-container" data-screen-label="02 Cover (Blue)">

  <!-- Top-left logo (light variant) -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:42px; top:32px; width:294px; height:112px; z-index:10;">
    <img src="../assets/logo.png" alt="Daiichi Life Techno Cross"
         style="width:100%; height:100%; object-fit:contain; object-position:left top;">
  </div>

  <!-- Decorative blue shapes background (covers slide from y=144 to bottom) -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:0; top:144px; width:1280px; height:576px; z-index:1;">
    <img src="../assets/cover2-bg.png" alt=""
         style="width:100%; height:100%; object-fit:cover;">
  </div>

  <!-- Cover title (white on blue) -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:79px; top:280px; width:1134px; z-index:10;
              font-size:var(--fs-cover-title); font-weight:700; color:#FFFFFF;
              line-height:1.05; letter-spacing:-0.5px;">
    Presentation Title
  </div>

  <!-- Date -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:79px; top:420px; width:440px; z-index:10;
              font-size:var(--fs-cover-meta); color:#FFFFFF; line-height:1.4;">
    2025.00.00
  </div>

  <!-- Company line -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:79px; top:462px; width:600px; z-index:10;
              font-size:var(--fs-cover-meta); color:#FFFFFF; line-height:1.4;">
    Daiichi Life Techno Cross Co., Ltd.
  </div>

</div>
</body>
</html>
