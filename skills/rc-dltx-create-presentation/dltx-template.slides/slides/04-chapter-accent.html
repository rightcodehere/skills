<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>04 Chapter — With Accent</title>
<link rel="stylesheet" href="../assets/chrome.css">
</head>
<body>
<div class="slide-container" data-screen-label="04 Chapter (Accent)">

  <!-- Top-right logo -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:1063px; top:25px; width:181px; height:69px; z-index:5;">
    <img src="../assets/logo.png" alt="Daiichi Life Techno Cross"
         style="width:100%; height:100%; object-fit:contain; object-position:right top;">
  </div>

  <!-- Chapter title -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:42px; top:42px; width:1000px; z-index:10;
              font-size:var(--fs-chapter-title); font-weight:700; color:var(--color-ink);
              line-height:1.1;">
    Chapter Title
  </div>

  <!-- Horizontal rule under title -->
  <div data-object="true" data-object-type="shape"
       style="position:absolute; left:35px; top:107px; width:1209px; height:2px; z-index:1;
              background:var(--color-cobalt);"></div>

  <!-- Bottom decorative band -->
  <div data-object="true" data-object-type="image"
       style="position:absolute; left:0; top:660px; width:1280px; height:60px; z-index:1;">
    <img src="../assets/cover-band.png" alt=""
         style="width:100%; height:100%; object-fit:cover; object-position:bottom;">
  </div>

  <!-- Page number -->
  <div data-object="true" data-object-type="textbox"
       style="position:absolute; left:1205px; top:625px; width:57px; z-index:10;
              font-size:var(--fs-pagenum); color:var(--color-pagenum); text-align:right;">
    4
  </div>

</div>
</body>
</html>
